<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도파민 RPG 계정 삭제</title><style>body{font-family:system-ui,sans-serif;max-width:480px;margin:0 auto;padding:24px;line-height:1.6;color:#222}input,button{font-size:1em;padding:10px;width:100%;box-sizing:border-box;margin:6px 0}button{background:#c62828;color:#fff;border:0;border-radius:6px}#m{font-weight:bold}</style></head><body>
<h1>도파민 RPG 계정 삭제</h1><p>아이디와 비밀번호를 넣으면 계정과 게임 저장 데이터가 <b>바로, 되돌릴 수 없게</b> 지워집니다. 같은 계정을 쓰는 RANDOM FOOTBALL 기록도 함께 지워집니다.</p>
<p>Google 로그인 계정은 게임 안 「상태 → ⚙ 계정」에서 지우거나, skmoon8603@gmail.com 으로 요청해 주세요.</p>
<input id="u" placeholder="아이디" autocomplete="username"><input id="p" type="password" placeholder="비밀번호" autocomplete="current-password"><label><input type="checkbox" id="c" style="width:auto"> 되돌릴 수 없다는 것을 이해했어요</label><button id="b">계정 영구 삭제</button><p id="m"></p>
<script>b.onclick=async()=>{if(!c.checked){m.textContent='확인란을 체크해 주세요';return;}b.disabled=true;m.textContent='처리 중…';try{const r=await fetch('https://random-football-cflg.onrender.com/api/rpg/deleteweb',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u.value,pw:p.value})});const j=await r.json().catch(()=>({}));m.textContent=r.ok?'계정이 삭제됐어요. 이용해 주셔서 고마워요.':j.error==='locked'?'잠시 후 다시 시도해 주세요':j.error==='forbidden'?'이 계정은 지울 수 없어요':'아이디 또는 비밀번호가 틀렸어요';}catch(e){m.textContent='서버에 연결하지 못했어요';}b.disabled=false;};</script></body></html>
