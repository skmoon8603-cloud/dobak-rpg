<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1030">
<title>도박 RPG</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0d0818;color:#f3ead7;font-family:'Galmuri11','Galmuri9',system-ui,sans-serif;touch-action:none}
canvas{display:block;image-rendering:pixelated;position:fixed;inset:0}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
/* HUD */
#hud{position:fixed;left:0;top:0;right:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 8px) 0 calc(env(safe-area-inset-left) + 8px);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#stat{background:rgba(20,10,40,.78);border:2px solid #6b4fa8;border-radius:8px;padding:6px 8px;min-width:170px;max-width:240px;width:46vw}
#stat .nm{font-size:13px;margin-bottom:4px;display:flex;justify-content:space-between}
.bar{height:11px;background:#2a1d45;border-radius:3px;margin:3px 0;position:relative;overflow:hidden}
.bar i{display:block;height:100%;transition:width .15s}
.bar span{position:absolute;inset:0;font-size:9px;line-height:11px;text-align:center;color:#fff;text-shadow:0 1px 0 #000}
#hpb i{background:linear-gradient(#ff6b6b,#c0392b)}#mpb i{background:linear-gradient(#6ba8ff,#2c5bc0)}#xpb i{background:linear-gradient(#ffe066,#d4a017)}
#xpb{height:10px}#xpb span{font-size:8px;line-height:10px}
#gold{font-size:12px;color:#ffd75e;margin-top:3px}
#topr{display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:auto}
#mapname{white-space:nowrap;background:rgba(20,10,40,.78);border:2px solid #6b4fa8;border-radius:8px;padding:4px 8px;font-size:12px}
.tbtn{background:#3b2766;border:2px solid #a585e8;color:#fff;border-radius:8px;padding:5px 7px;font-size:12px;white-space:nowrap}
.trow{display:flex;gap:4px;justify-content:flex-end}
#chatbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 150px);width:min(360px,94vw);display:flex;gap:6px;z-index:15;background:rgba(20,10,40,.9);border:2px solid #a585e8;border-radius:10px;padding:6px}
#chatbar input{flex:1;min-width:0;font-size:14px;padding:6px}
#boss{position:fixed;top:calc(env(safe-area-inset-top) + 152px);left:50%;transform:translateX(-50%);width:min(70vw,460px);pointer-events:none;text-align:center;font-size:12px;color:#e9c6ff}
#boss .bar{height:12px;border:1px solid #9b59b6}#boss .bar i{background:linear-gradient(#c56cf0,#6c1fa3)}
#qtrack{position:fixed;left:calc(env(safe-area-inset-left) + 8px);top:calc(env(safe-area-inset-top) + 104px);max-width:62vw;font-size:11px;line-height:1.5;pointer-events:none;color:#ffe9a8;text-shadow:0 1px 0 #000}
#qtrack div{background:rgba(20,10,40,.72);border-left:3px solid #ffe066;border-radius:4px;padding:2px 7px;margin-bottom:3px;display:table}
#qtrack div.h{border-left-color:#c58bff;color:#e3c8ff}
#qtrack div.ok{border-left-color:#7dff7d;color:#b8ffb8}
#toast{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);font-size:22px;color:#ffe066;text-shadow:0 2px 0 #000,0 0 12px #c08bff;pointer-events:none;text-align:center;transition:opacity .4s;opacity:0;white-space:nowrap}
#log{position:fixed;left:calc(env(safe-area-inset-left) + 8px);bottom:calc(env(safe-area-inset-bottom) + 215px);font-size:11px;pointer-events:none;max-width:55vw;text-shadow:0 1px 0 #000}
#log div{opacity:.9;margin-top:2px}
/* controls */
#ctrl{position:fixed;right:calc(env(safe-area-inset-right) + 10px);bottom:calc(env(safe-area-inset-bottom) + 10px);width:232px;height:190px;pointer-events:none}
.cb{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid #c9b3ff;background:rgba(59,39,102,.85);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;line-height:1.1;touch-action:none;overflow:hidden;padding:0}
.cb b{font-size:18px;font-weight:normal}
.cb .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);pointer-events:none}
.cb .key{position:absolute;top:2px;right:6px;font-size:9px;opacity:.7}
.cb.lock{filter:grayscale(1);opacity:.5}
.cb.press{transform:scale(.92);background:rgba(120,90,200,.95)}
#bAtk{width:84px;height:84px;right:0;bottom:0;background:rgba(160,50,60,.9);border-color:#ffb3b3}
#bAtk b{font-size:28px}
.sk{width:56px;height:56px;font-size:10px;word-break:keep-all;text-align:center}
.sk b{font-size:18px}
.sk.arm{border-color:#ffe066;box-shadow:0 0 0 3px #ffe066,0 0 16px #ffe066;background:rgba(150,110,20,.95)}
#bS1{right:104px;bottom:66px}#bS2{right:56px;bottom:104px}#bS3{right:0;bottom:92px}
#bDash{right:92px;bottom:4px;width:58px;height:58px;background:rgba(30,120,140,.92);border-color:#b3f0ff}
.pot{width:42px;height:42px;font-size:9px}
#bHp{right:172px;bottom:0;background:rgba(150,30,40,.85)}#bMp{right:172px;bottom:46px;background:rgba(30,60,150,.85)}
#bAct{right:166px;bottom:98px;width:60px;height:60px;background:rgba(200,150,30,.92);border-color:#fff2b3;font-size:13px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 190px);background:rgba(20,10,40,.85);border:2px solid #ffe066;border-radius:8px;padding:5px 10px;font-size:12px;color:#ffe9a8;pointer-events:none;white-space:nowrap;z-index:5}
.login{display:flex;flex-direction:column;gap:8px;width:min(300px,86vw);align-items:stretch}
#lMsg{min-height:16px;font-size:12px;color:#ff9a9a;text-align:center}
#tArea{display:flex;flex-direction:column;align-items:center;gap:12px}
.slots{display:flex;gap:3px;width:100%;justify-content:flex-end;align-items:center;font-size:11px;color:#b7a6d9}
.sl{width:32px;height:28px;border-radius:6px;border:2px solid #4d3880;background:#1d1236;color:#cbb;font-family:inherit;font-size:11px;padding:0}
.sl.on{background:#ffe066;color:#222;border-color:#fff}
/* panels */
.ovl{position:fixed;inset:0;background:rgba(5,2,12,.72);display:flex;align-items:center;justify-content:center;z-index:20;padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 10px)}
.panel{background:#1d1236;border:3px solid #8a6bd1;border-radius:12px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 0 0 3px #0d0818,0 10px 40px #000}
.panel h2{margin:0;padding:10px 14px;font-size:17px;color:#ffe9a8;border-bottom:2px solid #3b2766;display:flex;justify-content:space-between;align-items:center}
.panel .body{padding:10px 14px;overflow:auto;font-size:13px;line-height:1.5}
.x{background:none;border:none;color:#fff;font-size:20px}
.tabs{display:flex;gap:4px;padding:8px 10px 0;flex-wrap:wrap}
.tabs button{background:#2a1d45;border:2px solid #4d3880;color:#cbb;border-radius:8px 8px 0 0;padding:6px 10px;font-size:12px}
.tabs button.on{background:#3b2766;color:#fff;border-color:#a585e8}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 8px;border-radius:8px;background:#261946;margin:5px 0}
.row .t{flex:1;min-width:0}
.row small{color:#b7a6d9;display:block;font-size:11px}
.btn{background:#5a3aa8;border:2px solid #b39cf0;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;white-space:nowrap}
.btn.gold{background:#8a6a12;border-color:#ffe066}
.btn.red{background:#8a1f2a;border-color:#ff9a9a}
.btn:disabled{opacity:.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.r1{color:#e8e8e8}.r2{color:#6fc3ff}.r3{color:#c58bff}.r4{color:#ffb84d}
/* dialog */
#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(640px,96vw);background:#1d1236;border:3px solid #8a6bd1;border-radius:12px;padding:12px 14px;z-index:40;box-shadow:0 0 0 3px #0d0818}
#dlg .who{color:#ffe066;font-size:13px;margin-bottom:4px}
#dlg .txt{font-size:14px;line-height:1.6;min-height:44px;white-space:pre-line}
#dlg .opts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
/* title */
#title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 30%,#3d1f6e 0%,#140a28 60%,#07040e 100%);padding:20px}
#title h1{font-size:clamp(40px,11vw,78px);margin:0;color:#ffd75e;text-shadow:0 4px 0 #8a3b12,0 0 30px #c08bff;letter-spacing:4px}
#title .sub{color:#c9b3ff;font-size:13px;margin-top:-6px}
#title .dice{font-size:40px;animation:spin 3s infinite linear}
@keyframes spin{to{transform:rotate(360deg)}}
.big{font-size:17px;padding:10px 28px;min-width:200px}
/* create */
#create .body{display:flex;flex-direction:column;gap:8px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.card{background:#261946;border:2px solid #4d3880;border-radius:8px;padding:7px;text-align:left;color:#fff;font-size:12px}
.card.on{border-color:#ffe066;background:#3b2766}
.card b{font-size:14px;color:#ffe9a8}
.card small{display:block;color:#b7a6d9;font-size:11px;margin-top:2px}
input{user-select:text;-webkit-user-select:text}
input[type=text],input[type=password]{font-family:inherit;background:#120a24;border:2px solid #6b4fa8;color:#fff;border-radius:8px;padding:8px;font-size:15px;width:100%}
#prev{width:96px;height:96px;image-rendering:pixelated;background:#2a1d45;border-radius:10px;border:2px solid #4d3880;position:static}
.coin{font-size:44px;text-align:center;margin:6px 0;height:56px}
.flip{animation:flip .12s infinite linear}
@keyframes flip{50%{transform:scaleX(.1)}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="stat">
    <div class="nm"><span id="hName">-</span><span id="hLv">Lv1</span></div>
    <div class="bar" id="hpb"><i></i><span></span></div>
    <div class="bar" id="mpb"><i></i><span></span></div>
    <div class="bar" id="xpb"><i></i><span></span></div>
    <div id="gold">💰 0 G</div>
  </div>
  <div id="topr">
    <div id="mapname">마을</div>
    <div class="trow"><button class="tbtn" id="bMute">🔊</button><button class="tbtn" id="bChat">💬</button><button class="tbtn" data-tab="stat">상태</button><button class="tbtn" data-tab="skill">스킬</button></div>
    <div class="trow"><button class="tbtn" data-tab="quest">퀘스트</button><button class="tbtn" data-tab="sys">저장</button><button class="tbtn" data-tab="equip">인벤토리</button></div>
  </div>
</div>
<div id="boss" class="hidden"><div id="bossDrop" style="font-size:10px;color:#ffe9a8;margin-bottom:3px;text-shadow:0 1px 0 #000">드랍: 🦴 모르간의 뼈 2~3개 · 🧥 모르간의 망토 10% · 내 직업 무기 · 행운의 부적</div><div id="bossName">Lv12 리치 모르간</div><div class="bar"><i></i></div></div>
<div id="qtrack"></div>
<div id="chatbar" class="hidden"><input type="text" id="chatIn" maxlength="40" placeholder="할 말을 쓰고 Enter" autocomplete="off"><button class="btn gold" id="chatSend">보내기</button></div>
<div id="toast"></div>
<div id="hint" class="hidden">🎯 쏠 곳을 터치하세요 (버튼을 한 번 더 누르면 자동 조준)</div>
<div id="log"></div>

<div id="ctrl" class="hidden">
  <button class="cb" id="bAtk"><span class="key">Space</span><b>⚔</b>공격</button>
  <button class="cb sk" id="bS1" data-i="0"></button>
  <button class="cb sk" id="bS2" data-i="1"></button>
  <button class="cb sk" id="bS3" data-i="2"></button>
  <button class="cb" id="bDash"><span class="key">Shift</span><b>💨</b>대쉬<div class="cd"></div></button>
  <button class="cb pot" id="bHp"><span class="key">Z</span>❤<span id="nHp">0</span></button>
  <button class="cb pot" id="bMp"><span class="key">X</span>💧<span id="nMp">0</span></button>
  <button class="cb hidden" id="bAct">대화</button>
</div>

<div id="dlg" class="hidden"><div class="who"></div><div class="txt"></div><div class="opts"></div></div>

<div id="title">
  <div class="dice">🎲</div>
  <h1>도박 RPG</h1>
  <div class="sub">운명을 건 마법세계 모험</div>
  <div id="tArea"></div>
  <div style="font-size:11px;color:#8d7bb3;margin-top:10px;text-align:center;line-height:1.6">PC: WASD/방향키 이동 · Space/클릭 공격 · 1~3 스킬 · Shift 대쉬 · E 대화 · Z/X 물약<br>폰: 왼쪽 화면 드래그 이동 · 스킬 버튼을 누른 뒤 화면을 터치하면 그곳으로 발사</div>
</div>

<div id="create" class="ovl hidden">
  <div class="panel">
    <h2>캐릭터 만들기</h2>
    <div class="body">
      <div style="display:flex;gap:10px;align-items:center">
        <canvas id="prev" width="48" height="48"></canvas>
        <div style="flex:1">이름<input type="text" id="cName" maxlength="8" placeholder="이름 입력" value="모험가"></div>
      </div>
      <div>종족</div><div class="cards" id="cRace"></div>
      <div>직업</div><div class="cards" id="cCls"></div>
      <button class="btn gold big" id="bStart" style="align-self:center">모험 시작</button>
    </div>
  </div>
</div>

<div id="menu" class="ovl hidden">
  <div class="panel" style="height:min(620px,100%)">
    <h2><span id="mTitle">메뉴</span><button class="x" id="mClose">✕</button></h2>
    <div class="tabs" id="mTabs"></div>
    <div class="body" id="mBody" style="flex:1"></div>
  </div>
</div>

<script>
'use strict';
// ================= 기본 =================
const TS=32;
const $=id=>document.getElementById(id);
const cv=$('game');let ctx=cv.getContext('2d');
let W=0,H=0,SC=1,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';SC=Math.max(1,Math.min(2,Math.min(W,H)/(10*TS)));}
addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function norm(x,y){const l=Math.hypot(x,y)||1;return{x:x/l,y:y/l};}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;

// ================= 사운드 =================
let AC=null;
function sfx(type){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);const t=AC.currentTime;const S={hit:[220,110,.06,'square',.05],shoot:[660,440,.05,'triangle',.04],coin:[880,1320,.08,'square',.04],lvl:[440,880,.4,'triangle',.08],hurt:[160,80,.12,'sawtooth',.06],boom:[120,40,.25,'sawtooth',.08],win:[523,1046,.3,'square',.06],lose:[300,100,.35,'sawtooth',.06],meow:[650,1250,.16,'triangle',.07]}[type]||[440,440,.05,'sine',.03];o.type=S[3];o.frequency.setValueAtTime(S[0],t);o.frequency.exponentialRampToValueAtTime(S[1],t+S[2]);g.gain.setValueAtTime(S[4],t);g.gain.exponentialRampToValueAtTime(.0001,t+S[2]);o.start(t);o.stop(t+S[2]+.02);}catch(e){}}

const SERVER=/github\.io$/.test(location.hostname)?'https://random-football-cflg.onrender.com':''; // 계정·실시간 서버 (RANDOM FOOTBALL)
const isHost=()=>!NET.live||NET.host;
function netEv(d){if(NET.sock&&NET.sock.connected)NET.sock.emit('ev',d);}
const NET={host:true,hostMap:null,dead:new Set(),checking:true,on:false,base:SERVER,token:null,uid:'',nick:'',cloud:null,dirty:false,busy:false,fail:0,guest:false,sock:null,live:false,playing:false,others:new Map()};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// ================= 배경음악 =================
const BGM=new Audio('village.mp3');BGM.loop=true;BGM.volume=.22;BGM.preload='auto';
let muted=false;try{muted=localStorage.getItem('dobakrpg_mute')==='1';}catch(e){}
// 들판·보스전 음악은 직접 만든 8비트 연주 (웹 오디오)
const SONGS={
 field:{bpm:112,lead:'square',vol:.028,tr:-12,
  mel:[76,79,84,79,76,79,81,79, 74,79,83,79,74,79,81,83, 84,81,76,81,84,83,81,76, 77,81,84,81,79,77,76,74,
       76,0,79,76,72,0,76,79, 81,0,84,81,76,0,81,84, 81,79,77,81,84,81,77,81, 79,83,86,83,79,0,79,0],
  bass:[48,0,55,0,48,0,55,0, 43,0,50,0,43,0,50,0, 45,0,52,0,45,0,52,0, 41,0,48,0,41,0,48,0,
        48,0,55,0,48,0,55,0, 45,0,52,0,45,0,52,0, 41,0,48,0,41,0,48,0, 43,0,50,0,43,0,47,0]},
 boss:{bpm:158,lead:'sawtooth',vol:.03,tr:0,drum:1,
  mel:[69,0,72,76,0,76,74,72, 71,0,72,69,0,0,76,0, 77,0,76,77,0,81,79,77, 79,0,74,79,0,83,81,79,
       81,0,76,81,0,84,83,81, 79,76,72,76,81,76,72,76, 77,72,69,72,77,81,84,81, 80,76,71,76,80,83,88,0],
  bass:[45,45,57,45,45,57,45,57, 45,45,57,45,45,57,45,57, 41,41,53,41,41,53,41,53, 43,43,55,43,43,55,43,55,
        45,45,57,45,45,57,45,57, 45,45,57,45,45,57,45,57, 41,41,53,41,41,53,41,53, 40,40,52,40,40,52,40,52]}};
const MUS={name:null,step:0,next:0,timer:null};
function tone(m,t,d,type,v){if(!m)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.1);g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.14);}
function musTick(){if(!MUS.name||!AC||AC.state!=='running')return;const S=SONGS[MUS.name],sd=30/S.bpm;if(MUS.next<AC.currentTime)MUS.next=AC.currentTime+.05;
 while(MUS.next<AC.currentTime+.2){const i=MUS.step%S.mel.length;if(S.mel[i])tone(S.mel[i]+S.tr,MUS.next,sd*.9,S.lead,S.vol);if(S.bass[i])tone(S.bass[i],MUS.next,sd*(S.drum?.8:1.8),'triangle',S.vol*2.2);if(S.drum&&i%2===0)kick(MUS.next);MUS.step++;MUS.next+=sd;}}
function musPlay(name){if(MUS.name===name)return;MUS.name=name;MUS.step=0;MUS.next=0;if(name){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){MUS.name=null;return;}if(!MUS.timer)MUS.timer=setInterval(musTick,40);}}
function bgmUpdate(){const k=P&&map&&NET.playing?map.key:null;const want=!muted&&k==='village';if(want&&BGM.paused)BGM.play().catch(()=>{});else if(!want&&!BGM.paused)BGM.pause();
 const boss=k==='dungeon'&&(map.sealed||enemies.some(e=>e.b.boss&&e.aggroed));
 musPlay(muted||!k?null:k==='field'?'field':boss?'boss':null);
 const b=document.getElementById('bMute');if(b){const t=muted?'🔇':'🔊';if(b.textContent!==t)b.textContent=t;}}
addEventListener('pointerdown',()=>{if(AC&&AC.state==='suspended')AC.resume();bgmUpdate();},true);addEventListener('keydown',()=>bgmUpdate(),true);

 else if(p.kind==='wave'){const a=Math.atan2(p.vy,p.vx),R=Math.max(16,p.r*1.4);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(a);ctx.lineCap='round';ctx.strokeStyle=p.color;ctx.lineWidth=7;ctx.globalAlpha=.5;ctx.beginPath();ctx.arc(-R*.6,0,R,-1.25,1.25);ctx.stroke();ctx.lineWidth=4;ctx.globalAlpha=.95;ctx.beginPath();ctx.arc(-R*.45,0,R,-1.1,1.1);ctx.stroke();ctx.strokeStyle='#ffffff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(-R*.35,0,R,-.9,.9);ctx.stroke();ctx.restore();ctx.globalAlpha=1;}
 else if(p.kind==='bullet'){const z=p.big?8:4;px(p.x-z/2,p.y-z/2,z,z,p.color);}

 else{ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(p.x-p.r*.3,p.y-p.r*.3,p.r*.4,0,7);ctx.fill();}
}

let gambling=false;
function coinFlip(bet){
 if(gambling)return;let v=bet==='all'?P.gold:+bet;if(v<=0||P.gold<v){$('gRes').textContent='골드가 부족해!';return;}
 gambling=true;P.gold-=v;const c=$('coin');c.classList.add('flip');$('gRes').textContent='빙글빙글…';sfx('shoot');
 setTimeout(()=>{c.classList.remove('flip');const win=Math.random()*100<Math.min(60,45+P.st.luck);
  if(win){P.gold+=v*2;c.textContent='🌕';$('gRes').innerHTML=`<span style="color:#7dff7d">앞면! +${v}G 획득 🎉</span>`;sfx('win');}
  else{c.textContent='🌑';$('gRes').innerHTML=`<span style="color:#ff8a8a">뒷면… ${v}G 잃음</span>`;sfx('lose');}
  $('gGold').textContent=P.gold.toLocaleString();gambling=false;setTimeout(()=>{if(menuTab==='gamble'&&!$('menu').classList.contains('hidden')){const r=$('gRes').innerHTML,ct=c.textContent;renderMenu();$('gRes').innerHTML=r;$('coin').textContent=ct;}},50);},900);
}
function openBox(){
 if(gambling||P.gold<300)return;if(bagStacks().length>=24){$('gBoxRes').textContent='가방이 가득 찼어!';return;}
 gambling=true;P.gold-=300;$('gBoxRes').textContent='📦 덜컹덜컹…';sfx('shoot');
 setTimeout(()=>{const r=Math.random()*100-P.st.luck*.3;let res;
  if(r<1)res='r4';else if(r<8)res=pickItem(3);else if(r<30)res=pickItem(2);else if(r<75)res=pickItem(1);else res=null;
  let msg;if(!res){msg='<span style="color:#ff8a8a">꽝! 빈 상자다…</span>';sfx('lose');}else{P.bag.push({id:res,plus:0});const it=ITEMS[res];msg=`<span class="r${it.tier}">${it.tier===4?'🌟 전설!! ':''}${it.name}</span> 획득!`;sfx('win');if(it.tier>=3)toast('🎰 '+it.name+'!');}
  gambling=false;renderMenu();$('gBoxRes').innerHTML=msg;},900);
}
const enhCost=e=>Math.round(60*(e.plus+1)*ITEMS[e.id].tier);
const enhRate=e=>Math.min(98,Math.max(10,95-11*e.plus)+Math.floor(P.st.luck/2));
function enhance(k){
 const e=P.eq[k];if(gambling||!e||e.plus>=10)return;const cost=enhCost(e);if(P.gold<cost)return;gambling=true;P.gold-=cost;const rate=enhRate(e);
 $('gEnhRes').textContent='⚒ 깡! 깡! 깡!';sfx('hit');
 setTimeout(()=>{let msg;if(Math.random()*100<rate){e.plus++;msg=`<span style="color:#7dff7d">강화 성공! ${ITEMS[e.id].name} +${e.plus}</span>`;sfx('win');if(e.plus>=7)toast('🔥 +'+e.plus+' 강화 성공!');}
  else if(e.plus>=3){e.plus--;msg=`<span style="color:#ff8a8a">강화 실패… +${e.plus}로 떨어졌다</span>`;sfx('lose');}
  else{msg='<span style="color:#ffb3b3">강화 실패! (하락 없음)</span>';sfx('lose');}
  gambling=false;calc();renderMenu();$('gEnhRes').innerHTML=msg;},700);
}

}
const goCreate=()=>{$('title').classList.add('hidden');$('create').classList.remove('hidden');renderCreate();};
function renderTitle(){
 const A=$('tArea');let h='';const logged=NET.on&&NET.token;
 if(NET.on&&!NET.token&&!NET.guest){
  h=`<div class="login"><div style="font-size:12px;color:#c9b3ff;text-align:center;line-height:1.6">RANDOM FOOTBALL 계정으로 로그인해요<br>처음이면 아이디·비밀번호를 정하고 회원가입</div>
  <input type="text" id="lId" placeholder="아이디 (2~20자)" maxlength="20" autocomplete="username" autocapitalize="off" spellcheck="false">
  <input type="password" id="lPw" placeholder="비밀번호 (6자 이상)" maxlength="64" autocomplete="current-password">
  <div id="lMsg"></div>
  <div style="display:flex;gap:8px"><button class="btn gold big" id="bIn" style="min-width:0;flex:1">로그인</button><button class="btn big" id="bUp" style="min-width:0;flex:1">회원가입</button></div>
  <button class="x" id="bGuest" style="font-size:12px;color:#8d7bb3;text-decoration:underline">로그인 없이 이 기기에만 저장하기</button></div>`;
 }else{
  if(logged)h+=`<div style="font-size:13px;color:#7dff7d">👤 ${esc(NET.nick)} 님 · 서버에 저장돼요</div>`;
  const c=NET.cloud,cont=logged?!!c:hasSave();
  h+=`<button class="btn gold big" id="bNew">새 게임</button><button class="btn big" id="bLoad" ${cont?'':'disabled'}>이어하기${logged&&c?` · Lv${c.lv||1} ${esc(c.name||'')}`:''}</button>`;
  if(logged&&!c&&hasSave())h+=`<button class="btn big" id="bImport">이 기기의 저장 가져오기</button>`;
  if(logged)h+=`<button class="x" id="bOut" style="font-size:12px;color:#8d7bb3;text-decoration:underline">로그아웃</button>`;
  else if(NET.on)h+=`<button class="x" id="bBack" style="font-size:12px;color:#8d7bb3;text-decoration:underline">계정으로 로그인하기</button>`;
  else h+=`<div style="font-size:11px;color:#8d7bb3;text-align:center;line-height:1.6">${NET.checking?'⏳ 계정 서버에 연결하는 중… (서버가 자고 있으면 1분쯤 걸려요)':'계정 서버에 연결하지 못했어요. 지금은 이 기기에만 저장돼요.<br>새로고침하면 다시 연결을 시도해요.'}</div>`;
 }
 A.innerHTML=h;const on=(id,f)=>{const b=$(id);if(b)b.onclick=f;};
 on('bIn',()=>netAuth('signin'));on('bUp',()=>netAuth('register'));
 on('bGuest',()=>{NET.guest=true;renderTitle();});on('bBack',()=>{NET.guest=false;renderTitle();});
 on('bOut',()=>{netLogout();renderTitle();});
 on('bNew',()=>{if(logged&&NET.cloud)dialog('⚠ 새 게임',[`서버에 저장된 캐릭터(Lv${NET.cloud.lv||1} ${NET.cloud.name||''})가 새 캐릭터로 바뀌어요. 정말 새로 시작할까요?`],[{t:'새로 시작',c:'red',f:goCreate},{t:'취소'}]);else goCreate();});
 on('bLoad',()=>{if(logged?!applySave(NET.cloud):!load()){toast('저장된 게임이 없어요');return;}startGame();});
 on('bImport',()=>{if(!load())return;startGame();save(true);netFlush();});
 const pw=$('lPw');if(pw)pw.onkeydown=e=>{if(e.key==='Enter')netAuth('signin');};
}
$('bStart').onclick=()=>{const nm=($('cName').value||'모험가').trim().slice(0,8)||'모험가';P=newPlayer(nm,selRace,selCls);$('create').classList.add('hidden');startGame(true);};
// 관리자(skmoon) 계정 전용 보상: Lv999 · 999,999G · 고양이 소드 (한 번만)
function adminGift(){P.flags.admin=1;const up=Math.max(0,999-P.lv);P.lv=Math.max(P.lv,999);P.exp=0;P.sp+=up;P.ap=(P.ap||0)+3*up;P.gold=Math.max(P.gold,999999);
 if(!(P.eq.weapon&&P.eq.weapon.id==='catsword')){if(P.eq.weapon)P.bag.push(P.eq.weapon);P.eq.weapon={id:'catsword',plus:0};}
 calc();P.hp=P.st.hp;P.mp=P.st.mp;autoLearn(true);setTimeout(()=>{toast('👑 관리자 보상 지급!');log('👑 Lv999 · 999,999G · 🐱 고양이 소드');save(true);},800);}
function startGame(isNew){
 $('title').classList.add('hidden');$('hud').classList.remove('hidden');$('ctrl').classList.remove('hidden');
 fixPlayer();calc();if(isNew){P.hp=P.st.hp;P.mp=P.st.mp;}
 if(NET.admin&&NET.token&&!P.flags.admin)adminGift();
 enterMap(P.map||'village',isNew?null:P.x,isNew?null:P.y);
 if(blocked(P.x,P.y,8)){P.x=map.start.x;P.y=map.start.y;}
 paused=false;NET.playing=true;netConnect();if(isNew)save(true);
 if(isNew)dialog('📜 이야기',[`${RACES[P.race].name} ${jobName(P)} ${P.name}, 평화의 마을에 도착했다.`,'최근 북쪽 던전에서 어둠의 리치 「모르간」이 깨어나 세상에 몬스터가 넘쳐나고 있다.','마을 북서쪽 「촌장의 집」 앞의 촌장을 찾아가 이야기를 들어보자.\n\n💡 마법 도서관에서 스킬북을 사면 새 스킬을 익힐 수 있어요. 대쉬(Shift/💨)로 공격을 피하세요!']);
}

// ================= 계정 · 서버 저장 · 실시간 =================
// SERVER: 다른 주소(GitHub Pages 등)에서 열었을 때 붙을 서버 주소. 비워두면 지금 접속한 주소의 서버를 쓴다.
function netLogout(){NET.token=null;NET.cloud=null;NET.uid='';NET.live=false;try{localStorage.removeItem('dobakrpg_session');}catch(e){}if(NET.sock){try{NET.sock.disconnect();}catch(e){}NET.sock=null;}NET.others.clear();}
async function netApi(path,body){const o={method:body?'POST':'GET',cache:'no-store',headers:{}};if(NET.token)o.headers.Authorization='Bearer '+NET.token;if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body);}
 const r=await fetch(NET.base+path,o);let j=null;try{j=await r.json();}catch(e){}return{status:r.status,ok:r.ok,j:j||{}};}
async function netCloud(){const r=await netApi('/api/rpg/save');if(r.status===401){netLogout();return false;}if(!r.ok)return false;NET.uid=r.j.id;NET.admin=!!r.j.admin;NET.nick=r.j.nick||'';NET.cloud=r.j.save||null;return true;}
const AUTHERR={exists:'이미 있는 아이디예요',bad_username:'아이디는 2~20자로 해주세요',bad_password:'비밀번호는 6자 이상이어야 해요',bad_login:'아이디 또는 비밀번호가 틀렸어요',locked:'5번 틀려서 5분 동안 잠겼어요',too_many_requests:'잠시 후 다시 시도해 주세요'};
async function netAuth(kind){const msg=$('lMsg'),u=$('lId').value.trim(),pw=$('lPw').value;if(u.length<2){msg.textContent=AUTHERR.bad_username;return;}if(pw.length<6){msg.textContent=AUTHERR.bad_password;return;}
 msg.style.color='#c9b3ff';msg.textContent='서버에 연결하는 중…';
 try{const r=await netApi('/api/'+kind,{username:u,password:pw});
  if(!r.ok||!r.j.session){msg.style.color='#ff9a9a';msg.textContent=AUTHERR[r.j.error]||'서버에 연결하지 못했어요';return;}
  NET.token=r.j.session;try{localStorage.setItem('dobakrpg_session',NET.token);}catch(e){}
  await netCloud();renderTitle();
 }catch(e){msg.style.color='#ff9a9a';msg.textContent='서버에 연결하지 못했어요';}}
async function netFlush(keep){if(!NET.token||!NET.dirty||NET.busy||!P)return;NET.busy=true;NET.dirty=false;const d=snap();
 try{const r=await fetch(NET.base+'/api/rpg/save',{method:'POST',keepalive:!!keep,headers:{'Content-Type':'application/json',Authorization:'Bearer '+NET.token},body:JSON.stringify({save:d})});
  if(r.ok){NET.cloud=d;NET.fail=0;}else if(r.status===401){log('⚠ 로그인이 만료됐어요. 타이틀에서 다시 로그인해 주세요');NET.token=null;}else{NET.dirty=true;}
 }catch(e){NET.dirty=true;if(!(NET.fail++%10))log('⚠ 서버 저장에 실패했어요. 다시 시도할게요');}
 NET.busy=false;}
setInterval(()=>netFlush(),4000);
addEventListener('visibilitychange',()=>{if(document.hidden&&P&&map&&NET.playing){save(true);netFlush(true);}});
function netConnect(){if(!NET.token||NET.sock)return;
 const go=()=>{if(NET.sock||!window.io)return;const k=window.io(NET.base+'/rpg',{auth:{token:NET.token},transports:['websocket','polling']});NET.sock=k;
  k.on('connect',()=>{NET.live=true;NET.host=true;NET.hostMap=null;});k.on('disconnect',()=>{NET.live=false;NET.others.clear();NET.host=true;NET.hostMap=null;if(P&&map)takeOver();});
  k.on('host',d=>{if(!d||!map||d.m!==map.key)return;const was=NET.host&&NET.hostMap===map.key;NET.host=!!d.h;NET.hostMap=map.key;
   if(NET.host){if(enemies.some(e=>e.mirror))takeOver();}else if(!enemies.every(e=>e.mirror)){enemies=[];projs=projs.filter(q=>q.owner!=='e');$('boss').classList.add('hidden');}});
  k.on('es',l=>{if(!Array.isArray(l)||!map||!P||(NET.host&&NET.hostMap===map.key))return;if(NET.hostMap!==map.key)return;syncMirrors(l);});
  k.on('ev',d=>{if(!d||!map||!P)return;
   if(d.k==='hit'){if(!isHost())return;const e=enemies.find(x=>x.id===d.id);if(!e||e.dead)return;const v=Math.max(1,Math.min(1e7,Math.round(+d.d||0)));e.hp-=v;e.hitT=.12;e.aggroed=true;addText(e.x+rnd(-6,6),e.y-e.r-8,v>=1e7?'∞':v,'#cfe8ff',10);
    if(d.s>0)e.slow=Math.max(e.slow,Math.min(6,+d.s));if(d.r>0&&!e.b.boss)e.root=Math.max(e.root,Math.min(4,+d.r));if(d.b>0){e.burn=Math.min(6,+d.b);e.burnD=Math.max(1,Math.min(1e6,+d.bd||1));}if((d.kx||d.ky)&&!e.b.boss)moveEnt(e,clamp(+d.kx||0,-1,1)*10,clamp(+d.ky||0,-1,1)*10);
    if(e.hp<=0)killEnemy(e);}
   else if(d.k==='kill'){NET.dead.add(d.id);if(NET.dead.size>200)NET.dead.clear();enemies=enemies.filter(x=>x.id!==d.id);if(ENEMIES[d.t])rewardKill({t:d.t,x:+d.x||0,y:+d.y||0});}
   else if(d.k==='gr'){if(map.key!=='village')return;const g=map.npcs.find(n=>n.granny);if(!g||g.chase>gameT)return;if(g.hx==null){g.hx=g.x;g.hy=g.y;}if(d.s){g.say=String(d.s).slice(0,40);g.angry=gameT+2;}if(!d.a){g.rx=clamp(+d.x||0,0,map.w*TS);g.ry=clamp(+d.y||0,0,map.h*TS);g.rT=nowS()+.6;}}
   else if(d.k==='dmg'){if(d.to===NET.uid&&!map.safe)hurtPlayer(Math.max(0,Math.min(1e5,+d.a||0)));}
   else if(d.k==='ep'){if(projs.length<400)projs.push({x:+d.x,y:+d.y,vx:+d.vx,vy:+d.vy,r:Math.min(20,+d.r||7),life:Math.min(4,+d.life||1),owner:'e',dmg:Math.max(0,+d.dmg||0),color:/^#[0-9a-f]{6}$/i.test(d.color)?d.color:'#c56cf0',kind:'orb',hit:new Set()});}});
  k.on('n',n=>{NET.total=+n||0;});
  k.on('c',d=>{if(!d||typeof d.t!=='string')return;const t=d.t.slice(0,60),o=NET.others.get(d.u);if(o){o.say=t;o.sayT=nowS()+5;}log('<b style="color:#9dffb0">'+esc(String(d.n||'?').slice(0,12))+'</b>: '+esc(t));});
  k.on('kicked',()=>log('⚠ 다른 기기에서 접속해서 실시간 연결이 끊겼어요'));
  k.on('ps',list=>{if(!Array.isArray(list))return;const seen=new Set();for(const a of list){if(!a||a[0]===NET.uid)continue;seen.add(a[0]);let o=NET.others.get(a[0]);if(!o){o={x:a[6],y:a[7],walk:0,fy:0};NET.others.set(a[0],o);}
    o.name=String(a[1]);o.race=a[2];o.cls=a[3];o.job=a[4];o.lv=a[5];o.tx=a[6];o.ty=a[7];o.fx=a[8];o.atk=!!a[9];o.w=!!a[10];o.wp=a[11];o.ar=a[12];if(Math.hypot(o.tx-o.x,o.ty-o.y)>200){o.x=o.tx;o.y=o.ty;}}
   for(const id of NET.others.keys())if(!seen.has(id))NET.others.delete(id);});};
 if(window.io)go();else{const sc=document.createElement('script');sc.src=NET.base+'/socket.io/socket.io.js';sc.onload=go;document.head.appendChild(sc);}}
let netLastMove=0;
setInterval(()=>{const k=NET.sock;if(!k||!k.connected||!P||!map||!NET.playing)return;const mv=getMove();
 k.volatile.emit('s',{m:map.key,n:P.name,r:P.race,c:P.cls,j:P.job||'',l:P.lv,x:P.x,y:P.y,f:P.fx<0?-1:1,a:P.atkAnim>0?1:0,w:mv.l>0&&!paused?1:0,wp:P.eq.weapon?P.eq.weapon.id:'',ar:P.eq.armor?P.eq.armor.id:''});
 if(NET.host&&NET.hostMap===map.key)k.emit('es',enemies.filter(e=>!e.mirror&&!e.dead).map(e=>[e.id,e.type,Math.round(e.x),Math.round(e.y),Math.round(e.hp),e.max,(e.strong?1:0)|(e.summon?2:0)|(e.slow>0?4:0)|(e.root>0?8:0)|(e.burn>0?16:0)|(e.aggroed?32:0),Math.round(e.atk)]));},100);
function netTick(dt){for(const o of NET.others.values()){const k=Math.min(1,dt*12);o.x+=(o.tx-o.x)*k;o.y+=(o.ty-o.y)*k;if(o.w)o.walk+=dt*10;}}
async function netInit(){
 renderTitle();
 for(let n=0;n<3&&!NET.on;n++){try{const r=await fetch(NET.base+'/api/rpg/ping',{cache:'no-store'});const j=await r.json();NET.on=!!(j&&j.rpg);}catch(e){NET.on=false;}if(!NET.on&&!SERVER)break;}
 NET.checking=false;
 if(NET.on){let t=null;try{t=localStorage.getItem('dobakrpg_session');if(!t){const f=localStorage.getItem('rf_auth');if(f)t=JSON.parse(f);}}catch(e){}
  if(typeof t==='string'&&t){NET.token=t;try{if(!(await netCloud())&&!NET.token){}}catch(e){NET.token=null;}}}
 if(!$('title').classList.contains('hidden'))renderTitle();
 let rs=null;try{rs=sessionStorage.getItem('dobakrpg_resume');sessionStorage.removeItem('dobakrpg_resume');}catch(e){}
 if(rs&&!NET.playing&&!$('title').classList.contains('hidden')&&(NET.on&&NET.token?applySave(NET.cloud):load())){startGame();log('🔄 새 버전으로 업데이트됐어요');}
}
netInit();
// 새 버전이 올라오면 저장하고 자동으로 새로고침한 뒤 이어서 시작한다
const UPD={base:null,busy:false};
async function updCheck(){if(UPD.busy||location.protocol==='file:')return;let t=null;try{const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});if(r.ok)t=await r.text();}catch(e){}
 if(!t||t.indexOf('<title>도박 RPG</title>')<0)return;if(UPD.base===null){UPD.base=t;return;}if(t===UPD.base)return;
 const typing=document.activeElement&&document.activeElement.tagName==='INPUT';if(typing||gambling)return;
 UPD.busy=true;if(NET.playing&&P&&map){toast('🔄 새 버전이 나왔어요! 저장하고 새로고침할게요');save(true);try{await netFlush();}catch(e){}try{sessionStorage.setItem('dobakrpg_resume','1');}catch(e){}await new Promise(r=>setTimeout(r,1500));}
 location.reload();}
updCheck();setInterval(updCheck,45000);

// ================= 루프 =================
let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(P&&map&&!paused)update(dt);
 netTick(dt);if(P&&map)bgmUpdate();
 if(P&&map)draw();else{ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0d0818';ctx.fillRect(0,0,cv.width,cv.height);}
 hud();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
setInterval(()=>{if(P&&map&&!paused&&!P.dead)save(true);},20000);
</script>
